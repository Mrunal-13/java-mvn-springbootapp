apiVersion: apps/v1
kind: Deployment
metadata:
  name: mn-eta-deploy
  labels:
    app: mn-eta-deploy-lbl
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mn-eta-app
  template:
    metadata:
      labels:
        app: mn-eta-app
    spec:
      containers:
      - name: mn-eta-container
        image: mrunalnimbalkr/sa-mywebapp:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mn-eta-np-service
  labels:
    app: mn-eta-np-app
spec:
  selector:
    app: mn-eta-deploy-lbl

  type: NodePort
  ports:
  - nodePort: 31028
    port: 8080
    targetPort: 8080
